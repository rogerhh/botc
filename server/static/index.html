<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blood on the Clocktower — Town Square</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<style>
  :root {
    --bg: #1a1410;
    --panel: #221c17;
    --board: #3a2a1d;
    --board-edge: #8a6a4b;
    --chair: #d9c9a8;
    --chair-edge: #5a3f27;
    --chair-hover: #f2e2bd;
    --chair-drag: #ffd27a;
    --st-fill: #6e1f1b;
    --st-edge: #f0c27a;
    --st-hover: #8c2824;
    --st-drag: #b8342d;
    --st-text: #f5e6c4;
    --text: #ece3d3;
    --muted: #a9988080;
    --accent: #c7453a;
    --accent-dim: #8a3029;
    --button: #3f3128;
    --button-hover: #554033;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #00000066;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex: 1;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  button {
    background: var(--button);
    color: var(--text);
    border: 1px solid #00000055;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s;
  }
  button:hover { background: var(--button-hover); }
  button:active { transform: translateY(1px); }
  button.danger { background: var(--accent-dim); }
  button.danger:hover { background: var(--accent); }

  .count {
    font-size: 13px;
    color: var(--muted);
    min-width: 90px;
    text-align: right;
  }

  main {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* Square board, sized to fit the available space. */
  #boardWrap {
    position: relative;
    aspect-ratio: 1 / 1;
    width: min(100%, calc(100vh - 88px));
    max-width: 100%;
  }

  #board {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #4a3525 0%, #2a1c13 100%);
    border: 2px solid var(--board-edge);
    border-radius: 6px;
    box-shadow: 0 4px 24px #00000088, inset 0 0 60px #00000077;
    touch-action: none; /* we handle touch drags */
  }

  .chair {
    cursor: grab;
    transition: r 0.12s, fill 0.12s;
  }
  .chair:hover { fill: var(--chair-hover); }
  .chair.dragging { cursor: grabbing; fill: var(--chair-drag); }

  .chair-name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 24px;
    font-weight: 700;
    fill: #2a1c13;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
  }
  .chair-character {
    font-size: 19px;
    font-weight: 500;
    font-style: italic;
    fill: #5a3f27;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
  }

  .storyteller-rect {
    cursor: grab;
    transition: fill 0.12s;
  }
  .storyteller-rect:hover { fill: var(--st-hover); }
  .storyteller-rect.dragging { cursor: grabbing; fill: var(--st-drag); }

  .storyteller-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    fill: var(--st-text);
    pointer-events: none;
    user-select: none;
    dominant-baseline: central;
    text-anchor: middle;
  }

  .hint {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }

  /* --- Edit-chair modal --- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: #000000b0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #00000088;
    border-radius: 8px;
    padding: 20px;
    width: min(360px, calc(100% - 32px));
    box-shadow: 0 12px 40px #000000cc;
  }
  .modal h2 {
    margin: 0 0 14px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #f0c27a;
  }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .modal input {
    width: 100%;
    font-size: 15px;
    padding: 9px 11px;
    background: #14100d;
    color: var(--text);
    border: 1px solid #00000099;
    border-radius: 6px;
    outline: none;
  }
  .modal input:focus { border-color: #f0c27a; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .modal-actions .right {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .modal-actions button.primary {
    background: #8a5a1c;
  }
  .modal-actions button.primary:hover { background: #a9731f; }

  /* --- QR modal --- */
  .qr-modal { width: min(420px, calc(100% - 32px)); }
  .qr-sub {
    margin: 0 0 10px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .faint { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .qr-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px;
    margin-top: 14px;
    background: #fff;
    border-radius: 6px;
    min-height: 200px;
    justify-content: center;
  }
  .qr-preview svg {
    display: block;
    width: 240px;
    height: 240px;
    image-rendering: pixelated;
  }
  .qr-link {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: #333;
    max-width: 100%;
    word-break: break-all;
    text-align: center;
  }
  .qr-candidates {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .qr-candidates .pill {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 999px;
    background: #14100d;
    color: var(--text);
    border: 1px solid #00000099;
    cursor: pointer;
  }
  .qr-candidates .pill:hover { border-color: #f0c27a; }
  .qr-candidates .label {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 2px;
  }
  .qr-warn {
    margin-top: 10px;
    padding: 8px 10px;
    background: #3a2c17;
    border: 1px solid #f0c27a88;
    border-radius: 6px;
    color: #f0c27a;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Blood on the Clocktower — Town Square</h1>
  <div class="toolbar">
    <button id="btnAdd">+ Add Chair</button>
    <button id="btnQR">QR Code</button>
    <span id="count" class="count">0 players</span>
  </div>
</header>

<main>
  <div id="boardWrap">
    <svg id="board" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <!-- Storyteller below chairs so chair drags win on overlap. -->
      <g id="storyteller"></g>
      <g id="chairs"></g>
    </svg>
    <div class="hint">Drag chairs to rearrange. Click (or tap) a chair to set the player and character.</div>
  </div>
</main>

<div id="editBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <form id="editForm" class="modal">
    <h2 id="editTitle">Edit chair</h2>
    <label for="editName">Player name</label>
    <input id="editName" type="text" maxlength="64" autocomplete="off" />
    <label for="editCharacter">Character</label>
    <input id="editCharacter" type="text" maxlength="64" autocomplete="off" />
    <div class="modal-actions">
      <button type="button" id="editRemove" class="danger">− Remove chair</button>
      <div class="right">
        <button type="button" id="editCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </div>
  </form>
</div>

<div id="qrBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal qr-modal">
    <h2>Phone view — QR code</h2>
    <p class="qr-sub">Players scan this to open the read-only town square on
      their phones.</p>

    <label for="qrUrl">Base URL</label>
    <input id="qrUrl" type="text" autocomplete="off" spellcheck="false" />
    <div id="qrCandidates" class="qr-candidates"></div>

    <label for="qrCode">Access code <span class="faint">(optional)</span></label>
    <input id="qrCode" type="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="leave blank if the server has no code" />

    <div class="qr-preview">
      <div id="qrSvgWrap"></div>
      <div id="qrLinkWrap" class="qr-link"></div>
    </div>

    <div id="qrWarn" class="qr-warn" style="display:none"></div>

    <div class="modal-actions">
      <div class="right">
        <button type="button" id="qrClose">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/qrcodegen.js"></script>
<script>
(() => {
  const BOARD_SIZE = 1000;          // SVG viewBox units
  const CHAIR_RADIUS = 51;
  const DRAG_SLOP = 10;             // board units before pointer-down counts as a drag
  const MAX_CHAIR_TEXT = 88;        // max chair text width (board units)
  const board = document.getElementById("board");
  const chairsG = document.getElementById("chairs");
  const storytellerG = document.getElementById("storyteller");
  const countEl = document.getElementById("count");

  // Local mirror of server state, keyed by chair id.
  const chairs = new Map();
  // Single storyteller marker; width/height come from the server.
  let storyteller = null;

  // ----- server IO -----

  async function refresh() {
    const r = await fetch("/api/state");
    const data = await r.json();
    chairs.clear();
    for (const c of data.chairs) chairs.set(c.id, c);
    storyteller = data.storyteller || null;
    render();
  }

  async function addChair() {
    const r = await fetch("/api/chairs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    const chair = await r.json();
    chairs.set(chair.id, chair);
    render();
  }

  async function removeChair(id) {
    try {
      const r = await fetch(`/api/chairs/${id}`, { method: "DELETE" });
      if (!r.ok && r.status !== 404) {
        console.warn("remove failed", r.status);
        return;
      }
      chairs.delete(id);
      render();
    } catch (e) {
      console.warn("remove failed", e);
    }
  }

  async function pushMove(id, x, y) {
    try {
      await fetch(`/api/chairs/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x, y }),
      });
    } catch (e) {
      console.warn("move failed", e);
    }
  }

  async function pushChairInfo(id, name, character) {
    try {
      const r = await fetch(`/api/chairs/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, character }),
      });
      if (r.ok) {
        const chair = await r.json();
        chairs.set(chair.id, chair);
        render();
      }
    } catch (e) {
      console.warn("chair info update failed", e);
    }
  }

  async function pushStorytellerMove(x, y) {
    try {
      await fetch(`/api/storyteller`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x, y }),
      });
    } catch (e) {
      console.warn("storyteller move failed", e);
    }
  }

  // ----- rendering -----

  function render() {
    renderStoryteller();

    chairsG.innerHTML = "";
    // Draw in id order for stable overlap behavior.
    const ordered = [...chairs.values()].sort((a, b) => a.id - b.id);
    for (const c of ordered) {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("data-id", c.id);
      g.setAttribute("transform", `translate(${c.x * BOARD_SIZE}, ${c.y * BOARD_SIZE})`);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("class", "chair");
      circle.setAttribute("r", CHAIR_RADIUS);
      circle.setAttribute("fill", "var(--chair)");
      circle.setAttribute("stroke", "var(--chair-edge)");
      circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      const name = (c.name || "").trim();
      const character = (c.character || "").trim();
      const textsToFit = [];
      if (name && character) {
        // Name above, role below.
        const tName = svgText("chair-name", name, 0, -13);
        const tChar = svgText("chair-character", character, 0, 15);
        g.appendChild(tName);
        g.appendChild(tChar);
        textsToFit.push(tName, tChar);
      } else if (name) {
        const tName = svgText("chair-name", name, 0, 2);
        g.appendChild(tName);
        textsToFit.push(tName);
      } else if (character) {
        const tChar = svgText("chair-character", character, 0, 2);
        g.appendChild(tChar);
        textsToFit.push(tChar);
      }

      chairsG.appendChild(g);
      // Fit text to the chair (after DOM insert so getComputedTextLength works).
      for (const t of textsToFit) fitText(t, MAX_CHAIR_TEXT);
      attachChairInteractions(g, c);
    }
    countEl.textContent = `${chairs.size} player${chairs.size === 1 ? "" : "s"}`;
  }

  function svgText(cls, text, x, y) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
    el.setAttribute("class", cls);
    el.setAttribute("x", x);
    el.setAttribute("y", y);
    el.setAttribute("dominant-baseline", "central");
    el.textContent = text;
    return el;
  }

  // Horizontally squish <text> if it's wider than maxWidth.
  function fitText(el, maxWidth) {
    let actual = 0;
    try { actual = el.getComputedTextLength(); } catch (e) { actual = 0; }
    if (!actual) {
      // Fallback when layout info isn't ready yet.
      const fs = parseFloat(getComputedStyle(el).fontSize) || 14;
      actual = (el.textContent || "").length * fs * 0.55;
    }
    if (actual > maxWidth) {
      el.setAttribute("textLength", maxWidth);
      el.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
  }

  function renderStoryteller() {
    storytellerG.innerHTML = "";
    if (!storyteller) return;

    const w = (storyteller.w ?? 0.14) * BOARD_SIZE;
    const h = (storyteller.h ?? 0.08) * BOARD_SIZE;
    const cx = storyteller.x * BOARD_SIZE;
    const cy = storyteller.y * BOARD_SIZE;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("transform", `translate(${cx}, ${cy})`);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("class", "storyteller-rect");
    rect.setAttribute("x", -w / 2);
    rect.setAttribute("y", -h / 2);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("fill", "var(--st-fill)");
    rect.setAttribute("stroke", "var(--st-edge)");
    rect.setAttribute("stroke-width", "3");
    g.appendChild(rect);

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", "storyteller-label");
    label.textContent = "STORYTELLER";
    g.appendChild(label);

    storytellerG.appendChild(g);
    attachStorytellerDrag(g, rect, w, h);
  }

  // ----- dragging -----

  // Convert a client (x, y) to SVG viewBox coordinates.
  function clientToBoard(clientX, clientY) {
    const pt = board.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = board.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const { x, y } = pt.matrixTransform(ctm.inverse());
    return { x, y };
  }

  function attachChairInteractions(g, chair) {
    // Click → open editor, drag → reposition.
    // We commit one way or the other once movement exceeds DRAG_SLOP.
    let pointerId = null;
    let startX = 0, startY = 0;       // board-units where the pointer went down
    let offsetX = 0, offsetY = 0;     // within-chair grab offset
    let mode = "idle";                // "idle" | "pending" | "drag"
    let pendingMove = null;
    const circle = g.querySelector("circle");

    function onDown(ev) {
      // Left mouse only; touch/pen always pass.
      if (ev.button !== 0 && ev.pointerType === "mouse") return;

      pointerId = ev.pointerId;
      g.setPointerCapture(pointerId);
      const { x, y } = clientToBoard(ev.clientX, ev.clientY);
      startX = x;
      startY = y;
      offsetX = x - chair.x * BOARD_SIZE;
      offsetY = y - chair.y * BOARD_SIZE;
      mode = "pending";
      ev.preventDefault();
    }

    function onMove(ev) {
      if (ev.pointerId !== pointerId) return;
      const { x, y } = clientToBoard(ev.clientX, ev.clientY);

      if (mode === "pending") {
        // Promote to drag once past the slop threshold.
        const dx = x - startX;
        const dy = y - startY;
        if (dx * dx + dy * dy < DRAG_SLOP * DRAG_SLOP) return;
        mode = "drag";
        circle.classList.add("dragging");
      }

      if (mode !== "drag") return;

      const minPx = CHAIR_RADIUS;
      const maxPx = BOARD_SIZE - CHAIR_RADIUS;
      const nx = Math.min(maxPx, Math.max(minPx, x - offsetX));
      const ny = Math.min(maxPx, Math.max(minPx, y - offsetY));
      chair.x = nx / BOARD_SIZE;
      chair.y = ny / BOARD_SIZE;
      g.setAttribute("transform", `translate(${nx}, ${ny})`);

      if (!pendingMove) {
        pendingMove = requestAnimationFrame(() => {
          pendingMove = null;
          pushMove(chair.id, chair.x, chair.y);
        });
      }
    }

    function onUp(ev) {
      if (ev.pointerId !== pointerId) return;
      const wasClick = mode === "pending";
      const wasDrag = mode === "drag";
      mode = "idle";
      circle.classList.remove("dragging");
      try { g.releasePointerCapture(pointerId); } catch {}
      pointerId = null;

      if (wasDrag) {
        pushMove(chair.id, chair.x, chair.y);
      } else if (wasClick) {
        openChairEditor(chair);
      }
    }

    g.addEventListener("pointerdown", onDown);
    g.addEventListener("pointermove", onMove);
    g.addEventListener("pointerup", onUp);
    g.addEventListener("pointercancel", onUp);
    // Suppress context menu on chairs (board handles its own).
    g.addEventListener("contextmenu", (ev) => ev.preventDefault());
  }

  function attachStorytellerDrag(g, rect, w, h) {
    let dragging = false;
    let offsetX = 0, offsetY = 0;
    let pointerId = null;
    let pendingMove = null;

    function onDown(ev) {
      dragging = true;
      pointerId = ev.pointerId;
      g.setPointerCapture(pointerId);
      rect.classList.add("dragging");
      const { x, y } = clientToBoard(ev.clientX, ev.clientY);
      offsetX = x - storyteller.x * BOARD_SIZE;
      offsetY = y - storyteller.y * BOARD_SIZE;
      ev.preventDefault();
    }

    function onMove(ev) {
      if (!dragging || ev.pointerId !== pointerId) return;
      const { x, y } = clientToBoard(ev.clientX, ev.clientY);
      // Clamp so the rectangle stays fully on the board.
      const minX = w / 2;
      const minY = h / 2;
      const maxX = BOARD_SIZE - w / 2;
      const maxY = BOARD_SIZE - h / 2;
      const nx = Math.min(maxX, Math.max(minX, x - offsetX));
      const ny = Math.min(maxY, Math.max(minY, y - offsetY));
      storyteller.x = nx / BOARD_SIZE;
      storyteller.y = ny / BOARD_SIZE;
      g.setAttribute("transform", `translate(${nx}, ${ny})`);

      if (!pendingMove) {
        pendingMove = requestAnimationFrame(() => {
          pendingMove = null;
          pushStorytellerMove(storyteller.x, storyteller.y);
        });
      }
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      rect.classList.remove("dragging");
      try { g.releasePointerCapture(pointerId); } catch {}
      pointerId = null;
      pushStorytellerMove(storyteller.x, storyteller.y);
    }

    g.addEventListener("pointerdown", onDown);
    g.addEventListener("pointermove", onMove);
    g.addEventListener("pointerup", onUp);
    g.addEventListener("pointercancel", onUp);
  }

  // ----- chair editor modal -----

  const editBackdrop = document.getElementById("editBackdrop");
  const editForm = document.getElementById("editForm");
  const editTitle = document.getElementById("editTitle");
  const editName = document.getElementById("editName");
  const editCharacter = document.getElementById("editCharacter");
  const editCancel = document.getElementById("editCancel");
  const editRemove = document.getElementById("editRemove");
  let editingChairId = null;

  function openChairEditor(chair) {
    editingChairId = chair.id;
    editTitle.textContent = `Edit chair #${chair.id}`;
    editName.value = chair.name || "";
    editCharacter.value = chair.character || "";
    editBackdrop.classList.add("open");
    // Delay focus so iOS doesn't fight the keyboard.
    setTimeout(() => editName.focus(), 30);
  }

  function closeChairEditor() {
    editingChairId = null;
    editBackdrop.classList.remove("open");
  }

  editCancel.addEventListener("click", closeChairEditor);
  editRemove.addEventListener("click", () => {
    if (editingChairId === null) return;
    const id = editingChairId;
    const chair = chairs.get(id);
    const label = chair && (chair.name || chair.character)
      ? `${chair.name || "—"} (${chair.character || "no role"})`
      : `Chair #${id}`;
    if (!window.confirm(`Remove ${label}?`)) return;
    closeChairEditor();
    removeChair(id);
  });
  editBackdrop.addEventListener("click", (ev) => {
    if (ev.target === editBackdrop) closeChairEditor();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && editBackdrop.classList.contains("open")) {
      closeChairEditor();
    }
  });
  editForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (editingChairId === null) return;
    const id = editingChairId;
    const name = editName.value.trim();
    const character = editCharacter.value.trim();
    closeChairEditor();
    pushChairInfo(id, name, character);
  });

  // Suppress context menu on empty board space.
  board.addEventListener("contextmenu", (ev) => ev.preventDefault());

  // ----- QR-code modal -----

  const qrBackdrop = document.getElementById("qrBackdrop");
  const qrUrlInput = document.getElementById("qrUrl");
  const qrCodeInput = document.getElementById("qrCode");
  const qrSvgWrap = document.getElementById("qrSvgWrap");
  const qrLinkWrap = document.getElementById("qrLinkWrap");
  const qrCandidates = document.getElementById("qrCandidates");
  const qrWarn = document.getElementById("qrWarn");
  const qrClose = document.getElementById("qrClose");

  function baseUrlFor(ip, port) {
    // HTTP only — TLS on a bare LAN IP needs a cert.
    const portPart = port ? ":" + port : "";
    return `http://${ip}${portPart}`;
  }

  async function detectBestUrl() {
    try {
      const r = await fetch("/api/host_info", { cache: "no-store" });
      if (!r.ok) throw new Error("host_info status " + r.status);
      const info = await r.json();
      if (info && info.lan_ip) {
        return {
          url: baseUrlFor(info.lan_ip, info.port || window.location.port),
          candidates: info.candidates || [],
          port: info.port || window.location.port || null,
        };
      }
    } catch (e) {
      console.warn("host_info failed:", e);
    }
    // Fallback to the origin we loaded from.
    return {
      url: window.location.origin,
      candidates: [],
      port: window.location.port || null,
    };
  }

  function renderCandidatePills(candidates, port) {
    qrCandidates.innerHTML = "";
    if (!candidates || candidates.length <= 1) return;
    const labelEl = document.createElement("span");
    labelEl.className = "label";
    labelEl.textContent = "other IPs:";
    qrCandidates.appendChild(labelEl);
    for (const ip of candidates) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill";
      b.textContent = ip;
      b.addEventListener("click", () => {
        qrUrlInput.value = baseUrlFor(ip, port);
        renderQr();
      });
      qrCandidates.appendChild(b);
    }
  }

  async function openQrModal() {
    // Open with a placeholder; upgrade when host_info responds.
    qrUrlInput.value = window.location.origin;
    qrCodeInput.value = "";
    qrCandidates.innerHTML = "";
    qrBackdrop.classList.add("open");
    renderQr();

    const info = await detectBestUrl();
    // Only overwrite if the user hasn't typed something else.
    if (qrUrlInput.value === window.location.origin) {
      qrUrlInput.value = info.url;
    }
    renderCandidatePills(info.candidates, info.port);
    renderQr();
  }

  function closeQrModal() {
    qrBackdrop.classList.remove("open");
  }

  function renderQr() {
    const base = qrUrlInput.value.trim().replace(/\/+$/, "");
    const code = qrCodeInput.value.trim();

    // Phone URL: base + /phone [+ ?code=...].
    let url = base;
    if (!url) {
      qrSvgWrap.innerHTML = "";
      qrLinkWrap.textContent = "";
      qrWarn.style.display = "block";
      qrWarn.textContent = "Enter a base URL to generate a QR code.";
      return;
    }
    url += "/phone";
    if (code) url += "?code=" + encodeURIComponent(code);

    qrLinkWrap.textContent = url;

    // Warn if this URL only works on the Storyteller's own machine.
    try {
      const host = new URL(url).hostname;
      if (host === "localhost" || host === "127.0.0.1" || host === "::1") {
        qrWarn.style.display = "block";
        qrWarn.textContent =
          "This URL only works on this computer. For a phone you'll want a " +
          "LAN IP (e.g. 192.168.x.x:8000) or a tunnel URL (Cloudflare, ngrok).";
      } else {
        qrWarn.style.display = "none";
      }
    } catch {
      qrWarn.style.display = "block";
      qrWarn.textContent = "That doesn't look like a valid URL.";
      qrSvgWrap.innerHTML = "";
      return;
    }

    // Quartile EC tolerates camera glare and minor rendering artifacts.
    const QRC = qrcodegen.QrCode;
    let qr;
    try {
      qr = QRC.encodeText(url, QRC.Ecc.QUARTILE);
    } catch (e) {
      qrSvgWrap.innerHTML = "";
      qrWarn.style.display = "block";
      qrWarn.textContent = "URL too long for a QR code: " + e.message;
      return;
    }
    qrSvgWrap.innerHTML = qrMatrixToSvg(qr, 4);
  }

  // border = quiet-zone width in modules (spec recommends ≥4).
  function qrMatrixToSvg(qr, border) {
    const n = qr.size + border * 2;
    const parts = [];
    parts.push(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" ` +
      `shape-rendering="crispEdges">`);
    // White background keeps the quiet zone light.
    parts.push(`<rect width="100%" height="100%" fill="#ffffff"/>`);
    // One path for all dark modules (cheaper than per-module rects).
    let d = "";
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.getModule(x, y)) {
          d += `M${x + border},${y + border}h1v1h-1z`;
        }
      }
    }
    parts.push(`<path d="${d}" fill="#000000"/>`);
    parts.push(`</svg>`);
    return parts.join("");
  }

  document.getElementById("btnQR").addEventListener("click", openQrModal);
  qrClose.addEventListener("click", closeQrModal);
  qrBackdrop.addEventListener("click", (ev) => {
    if (ev.target === qrBackdrop) closeQrModal();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && qrBackdrop.classList.contains("open")) {
      closeQrModal();
    }
  });
  qrUrlInput.addEventListener("input", renderQr);
  qrCodeInput.addEventListener("input", renderQr);

  // ----- toolbar -----

  document.getElementById("btnAdd").addEventListener("click", addChair);

  // Initial load.
  refresh();

  // Poll for cross-browser sync; skip while a drag is in flight.
  setInterval(() => {
    if (board.querySelector(".dragging")) return;
    refresh();
  }, 2000);
})();
</script>

</body>
</html>
