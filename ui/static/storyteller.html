<button type="button" id="phaseFab" class="start-night">🌙 Start Night</button>

<!-- QR encoder used by the player-join QR modal. Same library the
     desktop QR modal uses; loaded here so the storyteller can render
     a /player QR directly from their phone. -->
<script src="/static/qrcodegen.js"></script>
<script>
(() => {
  // -----------------------------------------------------------------
  // Constants. Mirror the desktop UI so chair positions / token sizes
  // line up cleanly when the storyteller flips between the two.
  // -----------------------------------------------------------------
  const BOARD_SIZE = 1000;
  const CHAIR_RADIUS = 51;
  const MAX_CHAIR_TEXT = 88;
  const POLL_STATE_MS = 1500;
  const POLL_PROMPT_MS = 600;

  const SVG_NS = "http://www.w3.org/2000/svg";
  const XLINK_NS = "http://www.w3.org/1999/xlink";

  // -----------------------------------------------------------------
  // Pinch-zoom + two-finger pan on the town square.
  //
  // The board <svg> has touch-action: none so the browser hands every
  // touch to JS. We track all active pointers (touch + pen) on the
  // board element. With ≥2 pointers we treat the gesture as a pinch:
  // mutate the SVG's viewBox so the focal point under the finger
  // centroid stays anchored, and the camera follows the centroid as
  // the fingers move. iOS Safari sometimes cancels multi-touch
  // pointer events and dispatches its proprietary GestureEvent
  // instead, so we also wire gesturestart/change/end as a fallback.
  // -----------------------------------------------------------------
  const _viewBox = { x: 0, y: 0, size: BOARD_SIZE };
  const _PINCH_MIN_SIZE = BOARD_SIZE / 6; // up to 6× zoom in

  function _board() { return document.getElementById("board"); }
  function _applyViewBox() {
    const b = _board();
    if (!b) return;
    b.setAttribute(
      "viewBox",
      `${_viewBox.x} ${_viewBox.y} ${_viewBox.size} ${_viewBox.size}`,
    );
    const btn = document.getElementById("btnZoomReset");
    if (btn) {
      btn.classList.toggle("visible", _viewBox.size < BOARD_SIZE - 0.5);
    }
  }
  function _clampViewBox() {
    _viewBox.size = Math.min(BOARD_SIZE, Math.max(_PINCH_MIN_SIZE, _viewBox.size));
    _viewBox.x = Math.min(BOARD_SIZE - _viewBox.size, Math.max(0, _viewBox.x));
    _viewBox.y = Math.min(BOARD_SIZE - _viewBox.size, Math.max(0, _viewBox.y));
  }
  function _resetViewBox() {
    _viewBox.x = 0;
    _viewBox.y = 0;
    _viewBox.size = BOARD_SIZE;
    _applyViewBox();
  }
  function _clientToView(cx, cy) {
    const b = _board();
    if (!b) return { x: 0, y: 0 };
    const r = b.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return { x: 0, y: 0 };
    return {
      x: _viewBox.x + ((cx - r.left) / r.width) * _viewBox.size,
      y: _viewBox.y + ((cy - r.top) / r.height) * _viewBox.size,
    };
  }
  // Set when a single-finger pan moves past the slop threshold; the
  // next click event is then suppressed so a pan-release doesn't
  // accidentally open a chair's seat panel.
  let _suppressNextClick = false;
  // Pixels the finger must move past before we treat a one-finger
  // touch as a pan rather than a tap on a chair.
  const _PAN_SLOP_PX = 8;

  function _setupPinchZoom() {
    const board = _board();
    if (!board) return;
    const pointers = new Map(); // pointerId -> {clientX, clientY}
    let start = null;
    // Single-finger pan state. Only active while pointers.size === 1
    // and the board is zoomed in (otherwise there's nothing to pan).
    let pan = null;

    function refreshPinchStart() {
      const pts = [...pointers.values()];
      if (pts.length < 2) return;
      const a = pts[0], b = pts[1];
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      start = {
        dist: Math.max(1, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)),
        size: _viewBox.size,
        focal: _clientToView(cx, cy),
      };
    }

    function beginPanIfPossible(pointerId) {
      // Only meaningful when zoomed in — otherwise the viewBox
      // already shows the whole board and there's nowhere to pan.
      if (_viewBox.size >= BOARD_SIZE - 0.5) {
        pan = null;
        return;
      }
      const p = pointers.get(pointerId);
      if (!p) return;
      pan = {
        pointerId,
        clientX: p.clientX,
        clientY: p.clientY,
        viewX: _viewBox.x,
        viewY: _viewBox.y,
        moved: false,
      };
    }

    board.addEventListener("pointerdown", (ev) => {
      if (ev.pointerType === "mouse") return;
      pointers.set(ev.pointerId, { clientX: ev.clientX, clientY: ev.clientY });
      if (pointers.size >= 2) {
        // Switching from pan to pinch: drop pan, start pinch.
        pan = null;
        refreshPinchStart();
      } else if (pointers.size === 1) {
        beginPanIfPossible(ev.pointerId);
      }
    });

    board.addEventListener("pointermove", (ev) => {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { clientX: ev.clientX, clientY: ev.clientY });

      // ---- Single-finger pan (only when zoomed in) ----
      if (pointers.size === 1 && pan && pan.pointerId === ev.pointerId) {
        const dx = ev.clientX - pan.clientX;
        const dy = ev.clientY - pan.clientY;
        if (!pan.moved && (dx * dx + dy * dy) < _PAN_SLOP_PX * _PAN_SLOP_PX) return;
        pan.moved = true;
        const r = board.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) return;
        // Convert client-pixel deltas to viewBox-unit deltas.
        const dxView = (dx / r.width) * _viewBox.size;
        const dyView = (dy / r.height) * _viewBox.size;
        _viewBox.x = pan.viewX - dxView;
        _viewBox.y = pan.viewY - dyView;
        _clampViewBox();
        _applyViewBox();
        ev.preventDefault();
        return;
      }

      // ---- Two-finger pinch ----
      if (pointers.size < 2 || !start) return;
      const pts = [...pointers.values()];
      const a = pts[0], b = pts[1];
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      const newDist = Math.max(1, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY));
      const ratio = start.dist / newDist;
      let newSize = start.size * ratio;
      newSize = Math.min(BOARD_SIZE, Math.max(_PINCH_MIN_SIZE, newSize));
      const r = board.getBoundingClientRect();
      const fx = (cx - r.left) / r.width;
      const fy = (cy - r.top) / r.height;
      _viewBox.size = newSize;
      _viewBox.x = start.focal.x - fx * newSize;
      _viewBox.y = start.focal.y - fy * newSize;
      _clampViewBox();
      _applyViewBox();
      ev.preventDefault();
    });

    function endPointer(ev) {
      if (ev.pointerType === "mouse") return;
      if (!pointers.has(ev.pointerId)) return;
      pointers.delete(ev.pointerId);

      // If a single-finger pan was active and the finger actually
      // moved, swallow the click that the browser will dispatch
      // next so we don't open a chair's seat panel by accident.
      if (pan && pan.pointerId === ev.pointerId) {
        if (pan.moved) {
          _suppressNextClick = true;
          // Clear the suppression after one event loop turn — the
          // synthetic click fires synchronously (or very nearly so)
          // after pointerup, so a short timeout is plenty.
          setTimeout(() => { _suppressNextClick = false; }, 350);
        }
        pan = null;
      }

      if (pointers.size < 2) start = null;
      else refreshPinchStart();

      // Coming out of a pinch back to one finger: hand control over
      // to single-finger pan with the remaining pointer so the user
      // can keep dragging without lifting both fingers.
      if (pointers.size === 1) {
        const id = [...pointers.keys()][0];
        beginPanIfPossible(id);
        // Already in motion — don't require slop again.
        if (pan) pan.moved = true;
      }
    }
    board.addEventListener("pointerup", endPointer);
    board.addEventListener("pointercancel", endPointer);

    // Capture-phase click swallower. Fires before any chair's
    // own click handler, so a pan-release won't accidentally
    // open a seat panel. ``stopImmediatePropagation`` also
    // blocks listeners on the target element itself.
    document.addEventListener("click", (ev) => {
      if (!_suppressNextClick) return;
      _suppressNextClick = false;
      ev.preventDefault();
      ev.stopImmediatePropagation();
    }, true);

    // iOS Safari fallback: when iOS hands us a GestureEvent instead
    // of multi-touch pointer events, drive the same viewBox math.
    let gestStart = null;
    board.addEventListener("gesturestart", (ev) => {
      ev.preventDefault();
      gestStart = {
        size: _viewBox.size,
        focal: _clientToView(ev.clientX, ev.clientY),
      };
    });
    board.addEventListener("gesturechange", (ev) => {
      ev.preventDefault();
      if (!gestStart) return;
      let newSize = gestStart.size / Math.max(0.01, ev.scale);
      newSize = Math.min(BOARD_SIZE, Math.max(_PINCH_MIN_SIZE, newSize));
      const r = board.getBoundingClientRect();
      const fx = (ev.clientX - r.left) / r.width;
      const fy = (ev.clientY - r.top) / r.height;
      _viewBox.size = newSize;
      _viewBox.x = gestStart.focal.x - fx * newSize;
      _viewBox.y = gestStart.focal.y - fy * newSize;
      _clampViewBox();
      _applyViewBox();
    });
    board.addEventListener("gestureend", (ev) => {
      ev.preventDefault();
      gestStart = null;
      pointers.clear();
    });

    // Reset button.
    const btn = document.getElementById("btnZoomReset");
    if (btn) {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        _resetViewBox();
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _setupPinchZoom);
  } else {
    _setupPinchZoom();
  }

  // Mirror of TOKEN_FILES from index.html. Maps semantic names to
  // the token PNG basename in /assets/tokens/.
  const TOKEN_FILES = {
    drunk:                      "drunk_is_the_drunk",
    fortune_teller_red_herring: "fortune_teller_red_herring",
    poisoned:                   "poisoner_poisoned",
    imp_dead:                   "imp_dead",
    monk_safe:                  "monk_safe",
    butler_master:              "butler_master",
    investigator_minion:        "investigator_minion",
    librarian_outsider:         "librarian_outsider",
    scarlet_woman_is_demon:     "scarlet_woman_is_the_demon",
    slayer_no_ability:          "slayer_no_ability",
    undertaker_died_today:      "undertaker_died_today",
    virgin_no_ability:          "virgin_no_ability",
    artist_no_ability:          "artist_no_ability",
    washerwoman_townsfolk:      "washerwoman_townsfolk",
    washerwoman_wrong:          "washerwoman_wrong",
    librarian_wrong:            "librarian_wrong",
    investigator_wrong:         "investigator_wrong",
  };
  function tokenUrl(key) {
    const base = TOKEN_FILES[key];
    return base ? "/assets/tokens/" + base + ".png" : null;
  }

  // -----------------------------------------------------------------
  // State.
  // -----------------------------------------------------------------
  const chairsG       = document.getElementById("chairs");
  const storytellerG  = document.getElementById("storyteller");

  const chairs              = new Map();   // chair id -> chair record
  const enginePlayersById   = new Map();   // engine player id -> Player
  let storyteller           = null;
  let poolState             = {};
  let engineState           = { phase: "setup", night_number: 0, day_number: 0,
                                winner: null, win_reason: null };

  // Prompt + selection state.
  let _currentPrompt = null;
  let _panelSession  = null;     // { key, character, target_pid, ... }
  let _selectedYesNo = null;
  let _selectedPlayerIds = [];
  let _selectedCharacter = null;
  let _selectedCharacters = [];
  let _currentHighlightPlayerIds = [];
  let _currentChairPickedIds = [];

  // Side panel state.
  let seatPanelChair = null;
  let seatPanelTokensExpanded = false;

  // -----------------------------------------------------------------
  // Server I/O.
  // -----------------------------------------------------------------
  async function refresh() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) return;
      const data = await r.json();

      chairs.clear();
      for (const c of data.chairs || []) chairs.set(c.id, c);
      storyteller = data.storyteller || null;

      enginePlayersById.clear();
      if (data.engine && Array.isArray(data.engine.players)) {
        for (const ep of data.engine.players) {
          if (ep && typeof ep.id === "number") {
            enginePlayersById.set(ep.id, ep);
          }
        }
      }
      if (data.engine) {
        engineState = {
          phase:        data.engine.phase || "setup",
          night_number: data.engine.night_number || 0,
          day_number:   data.engine.day_number || 0,
          winner:       data.engine.winner || null,
          win_reason:   data.engine.win_reason || null,
        };
      }
      poolState = data.character_pool || {};
      reflectPhaseClass();
      render();
      reflectSeatPanel();
    } catch (e) {
      // transient — next tick will retry
    }
  }

  async function pollPrompt() {
    try {
      const r = await fetch("/api/prompt", { cache: "no-store" });
      if (!r.ok) return;
      const data = await r.json();
      const p = data.prompt;
      const samePrompt = p && _currentPrompt && p.id === _currentPrompt.id;
      if (!samePrompt) {
        _currentPrompt = p || null;
        _selectedYesNo = null;
        _selectedPlayerIds = [];
        _selectedCharacter = null;
        _selectedCharacters = [];
        renderPrompt();
      }
    } catch (e) { /* ignore */ }
  }

  function reflectPhaseClass() {
    const tag = document.getElementById("phaseTag");
    document.body.classList.remove(
      "phase-setup", "phase-night", "phase-day", "phase-finished"
    );
    document.body.classList.add("phase-" + engineState.phase);
    let label = engineState.phase;
    if (engineState.phase === "night" && engineState.night_number) {
      label = "Night " + engineState.night_number;
    } else if (engineState.phase === "day" && engineState.day_number) {
      label = "Day " + engineState.day_number;
    } else if (engineState.phase === "finished") {
      label = "ended";
    }
    tag.textContent = label;
    if (engineState.phase === "finished") {
      const banner = document.getElementById("gameEndBanner");
      const w = engineState.winner;
      const r = engineState.win_reason || "";
      if (w) {
        banner.textContent = `${w.toUpperCase()} WIN — ${r}`;
      } else {
        banner.textContent = "Game Over";
      }
    }
  }

  // -----------------------------------------------------------------
  // Rendering: chairs + tokens + shroud + storyteller marker.
  // -----------------------------------------------------------------
  function render() {
    renderStoryteller();
    renderChairs();
    reapplyHighlight();
    reapplyChairSelection();
  }

  function renderStoryteller() {
    storytellerG.innerHTML = "";
    if (!storyteller) return;

    const w = (storyteller.w ?? 0.14) * BOARD_SIZE;
    const h = (storyteller.h ?? 0.08) * BOARD_SIZE;
    const cx = storyteller.x * BOARD_SIZE;
    const cy = storyteller.y * BOARD_SIZE;

    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("transform", `translate(${cx}, ${cy})`);

    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("class", "storyteller-rect");
    rect.setAttribute("x", -w / 2);
    rect.setAttribute("y", -h / 2);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    g.appendChild(rect);

    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("class", "storyteller-label");
    label.textContent = "STORYTELLER";
    g.appendChild(label);

    storytellerG.appendChild(g);
  }

  function renderChairs() {
    chairsG.innerHTML = "";
    const targetSet = computeTargetChairIds(_currentHighlightPlayerIds);
    const ordered = [...chairs.values()].sort((a, b) => a.id - b.id);
    // ``show-player`` normally collapses chairs to player-name-only.
    // The ``show-full-grimoire`` flag (set by the Spy's grimoire
    // prompt) opts a chair out of that collapse so the Spy can see
    // every character and token. We treat the two classes together
    // so the JS path matches the CSS guards above.
    const showPlayer = document.body.classList.contains("show-player")
      && !document.body.classList.contains("show-full-grimoire");

    for (const c of ordered) {
      const g = document.createElementNS(SVG_NS, "g");
      g.setAttribute("data-id", c.id);
      if (targetSet.has(c.id)) g.classList.add("highlight-target");
      g.setAttribute("transform",
        `translate(${c.x * BOARD_SIZE}, ${c.y * BOARD_SIZE})`);

      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("class", "chair");
      circle.setAttribute("r", CHAIR_RADIUS);
      circle.setAttribute("fill", "var(--chair)");
      circle.setAttribute("stroke", "var(--chair-edge)");
      circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      // Show-player mode strips the grimoire down to just the player
      // name; everything else (number, character, tokens, shroud) is
      // hidden via CSS, but we also skip generating the heavier nodes
      // so the hand-off reads cleanly even with no styles.
      const name = (c.name || "").trim();
      const character = (c.character || "").trim();
      const isDrunk = (character === "Drunk");
      const characterDisplay = (isDrunk && poolState.drunk_fake_role)
        ? poolState.drunk_fake_role
        : character;

      const textsToFit = [];
      if (showPlayer) {
        // Just the player name, large and centered. No character, no
        // number, nothing that would leak grimoire state.
        if (name) {
          const tName = svgText("chair-name", name, 0, 2);
          g.appendChild(tName);
          textsToFit.push(tName);
        }
        chairsG.appendChild(g);
        for (const t of textsToFit) fitText(t, MAX_CHAIR_TEXT);
        attachChairInteractions(g, c);
        continue;
      }

      // Evil chairs flip: seat number drops to the bottom, character
      // row mirrors above the player name. Driven by the *live*
      // alignment on the chair (``c.alignment``), not the static
      // ``char_type`` — alignment is mutable (e.g. the Goon flips
      // its own alignment with its ability), and the chair has to
      // follow that runtime state without a client-side allowlist
      // of "always-evil" characters.
      const isEvil = (c.alignment === "evil");

      appendChairNumber(g, c.id, isEvil);

      if (name) {
        if (character && isEvil) {
          // Mirrored across the chair center: character at y=-22
          // (above), player name at y=+5 (below). These are the
          // negatives of the good-side y=22 / y=-5 positions, so the
          // evil chair reads as the top-to-bottom reflection of a
          // good chair.
          const tChar = svgText("chair-character", characterDisplay, 0, -22);
          g.appendChild(tChar);
          textsToFit.push(tChar);
          const tName = svgText("chair-name", name, 0, 5);
          g.appendChild(tName);
          textsToFit.push(tName);
        } else {
          const tName = svgText("chair-name", name, 0, -5);
          g.appendChild(tName);
          textsToFit.push(tName);
          if (character) {
            const tChar = svgText("chair-character", characterDisplay, 0, 22);
            g.appendChild(tChar);
            textsToFit.push(tChar);
          }
        }
      } else if (character) {
        // No player name yet — good chairs offset the character
        // slightly below center (y=10) so the seat number above
        // breathes; evil chairs mirror that to y=-10.
        const tChar = svgText(
          "chair-character", characterDisplay, 0, isEvil ? -10 : 10);
        g.appendChild(tChar);
        textsToFit.push(tChar);
      }

      // Status reminder tokens. Mirror desktop's angle layout exactly
      // so a chair looks the same on both screens.
      const cPid = (typeof c.player_id === "number") ? c.player_id : null;
      const inList = (arr) => Array.isArray(arr)
        && cPid !== null
        && arr.indexOf(cPid) !== -1;
      const isPidEq = (id) => cPid !== null && id === cPid;

      const ftRedHerringRole       = poolState.ft_red_herring_role || null;
      const wwTownsfolkRole        = poolState.washerwoman_townsfolk_role || null;
      const wwWrongRole            = poolState.washerwoman_wrong_role || null;
      const investigatorMinionRole = poolState.investigator_minion_role || null;
      const investigatorWrongRole  = poolState.investigator_wrong_role || null;
      const librarianOutsiderRole  = poolState.librarian_outsider_role || null;
      const librarianWrongRole     = poolState.librarian_wrong_role || null;

      const isRedHerring         = !!ftRedHerringRole && character === ftRedHerringRole;
      const isWashTownsfolk      = !!wwTownsfolkRole && character === wwTownsfolkRole;
      const isWashWrong          = !!wwWrongRole && character === wwWrongRole;
      const isInvestigatorMinion = !!investigatorMinionRole && character === investigatorMinionRole;
      const isInvestigatorWrong  = !!investigatorWrongRole && character === investigatorWrongRole;
      const isLibrarianOutsider  = !!librarianOutsiderRole && character === librarianOutsiderRole;
      const isLibrarianWrong     = !!librarianWrongRole && character === librarianWrongRole;
      const isButlerMaster       = isPidEq(poolState.butler_master_player_id);
      const isMonkSafe           = isPidEq(poolState.monk_safe_player_id);
      const isPoisoned           = isPidEq(poolState.poisoned_player_id);
      const isImpDead            = inList(poolState.imp_dead_player_ids);
      const isUndertakerDied     = isPidEq(poolState.undertaker_died_today_player_id);
      const swPromotedIds = Array.isArray(poolState.scarlet_woman_promoted_player_ids)
        ? poolState.scarlet_woman_promoted_player_ids : [];
      const isScarletWomanIsDemon = inList(swPromotedIds);
      const isSlayerSpent        = inList(poolState.slayer_no_ability_player_ids);
      const isVirginSpent        = inList(poolState.virgin_no_ability_player_ids);
      const isArtistSpent        = inList(poolState.artist_no_ability_player_ids);

      // Same angle assignments as desktop.
      if (isDrunk)               appendStatusToken(g, "drunk", 30);
      if (isRedHerring)          appendStatusToken(g, "fortune_teller_red_herring", -30);
      if (isWashTownsfolk)       appendStatusToken(g, "washerwoman_townsfolk", -60);
      if (isWashWrong)           appendStatusToken(g, "washerwoman_wrong", -60);
      if (isInvestigatorMinion)  appendStatusToken(g, "investigator_minion", -90);
      if (isInvestigatorWrong)   appendStatusToken(g, "investigator_wrong", -90);
      if (isLibrarianOutsider)   appendStatusToken(g, "librarian_outsider", -120);
      if (isLibrarianWrong)      appendStatusToken(g, "librarian_wrong", -120);
      if (isButlerMaster)        appendStatusToken(g, "butler_master", 60);
      if (isMonkSafe)            appendStatusToken(g, "monk_safe", 90);
      if (isPoisoned)            appendStatusToken(g, "poisoned", 120);
      if (isScarletWomanIsDemon) appendStatusToken(g, "scarlet_woman_is_demon", 150);
      if (isImpDead)             appendStatusToken(g, "imp_dead",
                                                    isScarletWomanIsDemon ? 165 : 150);
      if (isUndertakerDied)      appendStatusToken(g, "undertaker_died_today", 180);
      if (isSlayerSpent)         appendStatusToken(g, "slayer_no_ability", -150);
      if (isVirginSpent)         appendStatusToken(g, "virgin_no_ability", -150);
      if (isArtistSpent)         appendStatusToken(g, "artist_no_ability", -150);

      // Dead shroud.
      const linkedPlayer = (typeof c.player_id === "number")
        ? enginePlayersById.get(c.player_id) || null
        : null;
      const isDead = !!(linkedPlayer && linkedPlayer.alive === false);
      if (isDead) {
        g.classList.add("chair-dead");
        appendChairShroud(g);
      }

      chairsG.appendChild(g);
      for (const t of textsToFit) fitText(t, MAX_CHAIR_TEXT);
      attachChairInteractions(g, c);
    }
  }

  function svgText(cls, text, x, y) {
    const el = document.createElementNS(SVG_NS, "text");
    el.setAttribute("class", cls);
    el.setAttribute("x", x);
    el.setAttribute("y", y);
    el.setAttribute("dominant-baseline", "central");
    el.textContent = text;
    return el;
  }

  function fitText(el, maxWidth) {
    let actual = 0;
    try { actual = el.getComputedTextLength(); } catch (e) { actual = 0; }
    if (!actual) {
      const fs = parseFloat(getComputedStyle(el).fontSize) || 14;
      actual = (el.textContent || "").length * fs * 0.55;
    }
    if (actual > maxWidth) {
      el.setAttribute("textLength", maxWidth);
      el.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
  }

  // Evil chairs (Minion / Demon) flip the seat number to the bottom
  // of the chair so the chair reads as the inverted twin of a good
  // chair. ``evil`` is derived from ``c.char_type`` in render().
  function appendChairNumber(g, num, evil) {
    const t = document.createElementNS(SVG_NS, "text");
    t.setAttribute("class", "chair-num");
    t.setAttribute("x", "0");
    t.setAttribute("y", evil ? "37" : "-37");
    t.setAttribute("dominant-baseline", "central");
    t.textContent = String(num);
    g.appendChild(t);
  }

  function appendStatusToken(g, tokenKey, angleDeg) {
    const BADGE_RADIUS = 31;
    const ICON_SIZE = BADGE_RADIUS * 2;
    const url = tokenUrl(tokenKey);
    if (!url) return;

    const theta = (angleDeg - 90) * Math.PI / 180;
    const dist = CHAIR_RADIUS + BADGE_RADIUS;
    const cx = dist * Math.cos(theta);
    const cy = dist * Math.sin(theta);

    const wrap = document.createElementNS(SVG_NS, "g");
    wrap.setAttribute("class", "chair-status-wrapper");

    const halo = document.createElementNS(SVG_NS, "circle");
    halo.setAttribute("class", "chair-status-halo");
    halo.setAttribute("cx", cx);
    halo.setAttribute("cy", cy);
    halo.setAttribute("r", BADGE_RADIUS + 1);
    halo.setAttribute("fill", "#fff");
    halo.setAttribute("stroke", "var(--chair-edge)");
    halo.setAttribute("stroke-width", "1.5");
    halo.setAttribute("pointer-events", "none");
    wrap.appendChild(halo);

    const img = document.createElementNS(SVG_NS, "image");
    img.setAttribute("href", url);
    img.setAttributeNS(XLINK_NS, "xlink:href", url);
    img.setAttribute("width", ICON_SIZE);
    img.setAttribute("height", ICON_SIZE);
    img.setAttribute("x", cx - ICON_SIZE / 2);
    img.setAttribute("y", cy - ICON_SIZE / 2);
    img.setAttribute("class", "chair-status-token chair-status-" + tokenKey);
    img.setAttribute("pointer-events", "none");
    wrap.appendChild(img);

    g.appendChild(wrap);
  }

  function appendChairShroud(g) {
    const sh = document.createElementNS(SVG_NS, "g");
    sh.setAttribute("class", "chair-shroud");
    const r = CHAIR_RADIUS + 1;
    const dipDx = (2 * r) / 3;
    const dipCy = r / 2;
    const cloth = document.createElementNS(SVG_NS, "path");
    cloth.setAttribute("class", "shroud-cloth");
    cloth.setAttribute(
      "d",
      `M ${-r} 0 ` +
      `A ${r} ${r} 0 0 1 ${r} 0 ` +
      `q ${-dipDx / 2} ${dipCy}, ${-dipDx} 0 ` +
      `q ${-dipDx / 2} ${dipCy}, ${-dipDx} 0 ` +
      `q ${-dipDx / 2} ${dipCy}, ${-dipDx} 0 ` +
      `Z`
    );
    sh.appendChild(cloth);
    const fold = document.createElementNS(SVG_NS, "path");
    fold.setAttribute("class", "shroud-fold");
    fold.setAttribute("d", `M 0 ${-r * 0.6} L 0 ${r * 0.6}`);
    sh.appendChild(fold);
    const mark = document.createElementNS(SVG_NS, "text");
    mark.setAttribute("class", "shroud-mark");
    mark.setAttribute("x", "0");
    mark.setAttribute("y", `${-r * 0.55}`);
    mark.textContent = "\u271D";
    sh.appendChild(mark);
    g.appendChild(sh);
  }

  // -----------------------------------------------------------------
  // Chair interaction.
  //
  // - Setup phase: read-only on the phone (banner reminds the ST that
  //   editing happens on the computer). Taps do nothing.
  // - Show-player mode: taps are inert. The grimoire is being shown
  //   to a player; we never want the side panel to pop open.
  // - In-game (night/day/finished): tap opens the per-player side
  //   panel UNLESS a SELECT_PLAYER prompt is active, in which case the
  //   tap is consumed as a selection toggle.
  // -----------------------------------------------------------------
  function attachChairInteractions(g, chair) {
    g.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (document.body.classList.contains("show-player")) return;

      // SELECT_PLAYER / SELECT_PLAYERS: tap is a pick.
      const p = _currentPrompt;
      if (p && (p.type === "select_player" || p.type === "select_players")) {
        handlePromptChairClick(chair);
        return;
      }
      // In-game: open side panel. Setup: do nothing (ST edits on
      // computer); a tap on the chair instead just nudges focus.
      if (engineState.phase === "setup") return;
      openSeatPanel(chair);
    });
  }

  function handlePromptChairClick(chair) {
    const p = _currentPrompt;
    if (!p) return;
    if (!(p.type === "select_player" || p.type === "select_players")) return;
    const pid = (typeof chair.player_id === "number") ? chair.player_id : chair.id;
    const eligible = p.eligible_player_ids || [];
    if (!eligible.includes(pid)) return;
    const count = p.count || 1;
    if (count === 1) {
      _selectedPlayerIds = [pid];
    } else {
      const idx = _selectedPlayerIds.indexOf(pid);
      if (idx >= 0) _selectedPlayerIds.splice(idx, 1);
      else if (_selectedPlayerIds.length < count) _selectedPlayerIds.push(pid);
      else {
        _selectedPlayerIds.shift();
        _selectedPlayerIds.push(pid);
      }
    }
    renderSelectionState();
  }

  // -----------------------------------------------------------------
  // Highlights / picked markers.
  // -----------------------------------------------------------------
  function applyHighlight(playerIds) {
    _currentHighlightPlayerIds = Array.isArray(playerIds) ? playerIds.slice() : [];
    reapplyHighlight();
  }

  function computeTargetChairIds(playerIds) {
    const playerToChair = new Map();
    for (const ch of chairs.values()) {
      if (ch.player_id != null) playerToChair.set(ch.player_id, ch);
    }
    const set = new Set();
    for (const pid of playerIds || []) {
      const ch = playerToChair.get(pid);
      if (ch) set.add(ch.id);
    }
    return set;
  }

  function reapplyHighlight() {
    const target = computeTargetChairIds(_currentHighlightPlayerIds);
    if (target.size === 0) {
      chairsG.classList.remove("highlight-active");
      chairsG.querySelectorAll("g[data-id]").forEach(g => {
        g.classList.remove("highlight-target");
      });
      return;
    }
    chairsG.classList.add("highlight-active");
    chairsG.querySelectorAll("g[data-id]").forEach(g => {
      const id = parseInt(g.getAttribute("data-id"), 10);
      g.classList.toggle("highlight-target", target.has(id));
    });
  }

  function reapplyChairSelection() {
    const pickedChairIds = new Set();
    if (_currentPrompt
        && (_currentPrompt.type === "select_player"
            || _currentPrompt.type === "select_players")) {
      const playerToChair = new Map();
      for (const ch of chairs.values()) {
        if (ch.player_id != null) playerToChair.set(ch.player_id, ch);
        else playerToChair.set(ch.id, ch);
      }
      for (const pid of _selectedPlayerIds) {
        const ch = playerToChair.get(pid);
        if (ch) pickedChairIds.add(ch.id);
      }
    }
    chairsG.querySelectorAll("g[data-id]").forEach(g => {
      const id = parseInt(g.getAttribute("data-id"), 10);
      g.classList.toggle("chair-picked", pickedChairIds.has(id));
    });
    _currentChairPickedIds = [...pickedChairIds];
  }

  function collectHighlightIds(p) {
    const ids = new Set();
    // Spy / future "study the whole grimoire" abilities: keep every
    // chair bright so the recipient can study the full board. Mirror
    // of the same early-return in index.html's collectHighlightIds.
    const meta = p && p.meta;
    if (meta && meta.show_full_grimoire) {
      return [];
    }
    // ``meta.no_highlight`` opts out of chair highlighting entirely —
    // no explicit list, no fallback to the target_player_id. Used by
    // info abilities (e.g. Clockmaker) where the receiving player
    // shouldn't see any seat lit up on the SHOW THIS TO PLAYER screen.
    if (meta && meta.no_highlight) {
      return [];
    }
    const explicit = Array.isArray(p.highlight_player_ids)
      && p.highlight_player_ids.length > 0;
    const isPlayerSelect =
      (p.type === "select_player" || p.type === "select_players");
    if (isPlayerSelect) {
      for (const id of (p.eligible_player_ids || [])) ids.add(Number(id));
      return [...ids].filter(n => Number.isFinite(n));
    }
    if (explicit) {
      for (const id of p.highlight_player_ids) ids.add(Number(id));
    }
    const isInfoExplicit = (p.type === "information") && explicit;
    if (p.target_player_id && !isInfoExplicit) {
      ids.add(Number(p.target_player_id));
    }
    return [...ids].filter(n => Number.isFinite(n));
  }

  // -----------------------------------------------------------------
  // Side panel (in-game; per-player view + actions).
  // -----------------------------------------------------------------
  const seatPanel  = document.getElementById("seatPanel");
  const seatClose  = document.getElementById("seatClose");
  const seatName   = document.getElementById("seatName");
  const seatSub    = document.getElementById("seatSub");
  const seatStates = document.getElementById("seatStates");
  const seatMsg    = document.getElementById("seatMsg");
  const seatActUseAbility = document.getElementById("seatAct_useAbility");
  const seatActNominate   = document.getElementById("seatAct_nominate");
  const seatActVoted      = document.getElementById("seatAct_voted");
  const seatActExecute    = document.getElementById("seatAct_execute");

  function openSeatPanel(chair) {
    seatPanelChair = chair;
    seatPanelTokensExpanded = false;
    seatMsg.textContent = "";
    seatMsg.classList.remove("ok");
    renderSeatPanel();
    seatPanel.classList.add("open");
    seatPanel.setAttribute("aria-hidden", "false");
  }
  function closeSeatPanel() {
    seatPanelChair = null;
    seatPanelTokensExpanded = false;
    seatPanel.classList.remove("open");
    seatPanel.setAttribute("aria-hidden", "true");
  }
  seatClose.addEventListener("click", closeSeatPanel);

  function reflectSeatPanel() {
    if (!seatPanelChair) return;
    // The chair record on the server may have updated; re-read it
    // from our chairs map by id.
    const fresh = chairs.get(seatPanelChair.id);
    if (!fresh) {
      closeSeatPanel();
      return;
    }
    seatPanelChair = fresh;
    renderSeatPanel();
  }

  function seatPlayer() {
    if (!seatPanelChair) return null;
    const pid = seatPanelChair.player_id;
    if (typeof pid !== "number") return null;
    return enginePlayersById.get(pid) || null;
  }

  function seatRow(label, value, valueClass) {
    const cls = valueClass ? ` class="value ${valueClass}"` : ` class="value"`;
    return `<div class="row"><span class="label">${escapeHtml(label)}</span>`
      + `<span${cls}>${escapeHtml(String(value))}</span></div>`;
  }

  function renderSeatPanel() {
    const p = seatPlayer();
    if (!p) {
      seatName.textContent = seatPanelChair
        ? (seatPanelChair.name || `Player #${seatPanelChair.id}`)
        : "—";
      seatSub.textContent = "(not yet seated in the engine)";
      seatStates.innerHTML = "";
      [seatActUseAbility, seatActNominate, seatActVoted, seatActExecute]
        .forEach(b => b.disabled = true);
      return;
    }
    seatName.textContent = p.name || `Player #${p.id}`;
    const subParts = [];
    if (p.character) subParts.push(p.character);
    if (p.char_type) subParts.push(p.char_type);
    if (p.alignment) subParts.push(p.alignment);
    seatSub.textContent = subParts.join(" · ");

    const rows = [];
    rows.push(`<div class="section-title">Identity</div>`);
    rows.push(seatRow("Character", p.character || "—"));
    if (p.perceived_character && p.perceived_character !== p.character) {
      rows.push(seatRow("Perceives self as", p.perceived_character));
    }
    rows.push(seatRow("Type", p.char_type || "—"));
    rows.push(seatRow(
      "Alignment",
      p.alignment || "—",
      p.alignment === "evil" ? "evil" : p.alignment === "good" ? "good" : ""
    ));

    rows.push(`<div class="section-title">Life</div>`);
    rows.push(seatRow(
      "Status",
      p.alive ? "Alive" : `Dead (${p.death_cause || "?"})`,
      p.alive ? "alive" : "dead"
    ));
    rows.push(seatRow(
      "Dead vote",
      p.has_dead_vote ? "available" : "spent",
      p.has_dead_vote ? "flag-on" : "flag-off"
    ));

    rows.push(`<div class="section-title">Conditions</div>`);
    rows.push(seatRow(
      "Drunk", p.drunk ? "yes" : "no",
      p.drunk ? "flag-on" : "flag-off"
    ));
    rows.push(seatRow(
      "Poisoned", p.poisoned ? "yes" : "no",
      p.poisoned ? "flag-on" : "flag-off"
    ));
    if (p.once_per_game) {
      rows.push(seatRow(
        "Once-per-game",
        p.once_per_game_used ? "spent" : "available",
        p.once_per_game_used ? "flag-off" : "flag-on"
      ));
    }
    if (Array.isArray(p.mad_about) && p.mad_about.length) {
      rows.push(seatRow("Mad about", p.mad_about.join(", ")));
    }

    rows.push(`<div class="section-title">Today</div>`);
    rows.push(seatRow(
      "Nominated today",
      p.has_nominated_today ? "yes" : "no",
      p.has_nominated_today ? "flag-on" : "flag-off"
    ));
    rows.push(seatRow(
      "Been nominated",
      p.has_been_nominated_today ? "yes" : "no",
      p.has_been_nominated_today ? "flag-on" : "flag-off"
    ));
    seatStates.innerHTML = rows.join("");

    // Wire action buttons (re-resolve on every render).
    const phase = engineState.phase;
    const inGame = (phase === "night" || phase === "day" || phase === "finished");
    seatActUseAbility.disabled = !inGame || !p.alive;
    seatActNominate.disabled   = !(phase === "day") || !p.alive || p.has_nominated_today;
    seatActVoted.disabled      = !(phase === "day");
    seatActExecute.disabled    = !inGame || !p.alive;
  }

  async function postEngine(path, payload) {
    try {
      const r = await fetch("/api/engine/" + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        seatMsg.classList.remove("ok");
        seatMsg.textContent = (data && data.error) || ("Failed: " + r.status);
        return false;
      }
      seatMsg.classList.add("ok");
      seatMsg.textContent = "OK.";
      setTimeout(() => { seatMsg.textContent = ""; }, 2500);
      await refresh();
      return true;
    } catch (e) {
      seatMsg.classList.remove("ok");
      seatMsg.textContent = "Network error.";
      return false;
    }
  }

  seatActUseAbility.addEventListener("click", () => {
    const p = seatPlayer();
    if (!p) return;
    postEngine("use_ability", { player_id: p.id });
  });
  seatActNominate.addEventListener("click", () => {
    // Nominate requires a target. For simplicity on phone we just
    // bring up a quick picker: turn this into a SELECT_PLAYER-style
    // tap on a target chair would be richer; for now we ask via
    // prompt(). The desktop UI shows a dedicated picker.
    const p = seatPlayer();
    if (!p) return;
    const targetName = window.prompt("Nominate which player (name or seat #)?", "");
    if (!targetName) return;
    let pid = null;
    const tnum = parseInt(targetName, 10);
    if (Number.isFinite(tnum)) {
      const ch = chairs.get(tnum);
      if (ch && typeof ch.player_id === "number") pid = ch.player_id;
    }
    if (pid === null) {
      const lc = targetName.trim().toLowerCase();
      for (const ch of chairs.values()) {
        if ((ch.name || "").trim().toLowerCase() === lc
            && typeof ch.player_id === "number") {
          pid = ch.player_id;
          break;
        }
      }
    }
    if (pid === null) {
      seatMsg.classList.remove("ok");
      seatMsg.textContent = "Couldn't resolve that player.";
      return;
    }
    postEngine("nominate", { nominator_id: p.id, nominee_id: pid });
  });
  seatActVoted.addEventListener("click", () => {
    const p = seatPlayer();
    if (!p) return;
    postEngine("vote", { player_id: p.id });
  });
  seatActExecute.addEventListener("click", () => {
    const p = seatPlayer();
    if (!p) return;
    if (!confirm(`Execute ${p.name || ("Player " + p.id)}?`)) return;
    postEngine("execute_player", { player_id: p.id });
  });

  // -----------------------------------------------------------------
  // Prompt rendering. Mirrors the desktop renderPrompt() but with a
  // mobile layout. Show-player mode (info prompts where the engine
  // has set ``shown_to_player``) hides this card and shows
  // #showCard instead, with the grimoire collapsed to names-only.
  // -----------------------------------------------------------------
  const promptCard = document.getElementById("promptCard");
  const promptTitle = document.getElementById("promptTitle");
  const promptDescription = document.getElementById("promptDescription");
  const promptStages = document.getElementById("promptStages");
  const promptOptions = document.getElementById("promptOptions");
  const promptHint = document.getElementById("promptHint");
  const btnNext = document.getElementById("btnNext");
  const btnBack = document.getElementById("btnBack");

  const showCard = document.getElementById("showCard");
  const showTarget = document.getElementById("showTarget");
  const showTokens = document.getElementById("showTokens");
  const showNext = document.getElementById("showNext");

  function panelKey(p) {
    const meta = p.meta || {};
    const character = meta.character || "";
    const tpid = (p.target_player_id == null) ? "" : String(p.target_player_id);
    return character + "|" + tpid;
  }

  function lookupPlayerName(pid) {
    if (pid == null) return null;
    for (const ch of chairs.values()) {
      const cpid = (typeof ch.player_id === "number") ? ch.player_id : ch.id;
      if (cpid === pid) return ch.name || ("Seat " + ch.id);
    }
    return null;
  }

  function renderPrompt() {
    const p = _currentPrompt;
    if (!p) {
      document.body.classList.remove(
        "has-prompt", "show-player", "show-full-grimoire",
      );
      applyHighlight([]);
      reapplyChairSelection();
      // Re-render so chairs revert from show-player layout.
      render();
      return;
    }

    const meta = p.meta || {};
    const isInfo = (p.type === "information");
    const isPayload = isInfo && !!p.shown_to_player;

    // Manage panel session — same heuristic as desktop, lighter.
    const newKey = panelKey(p);
    if (!_panelSession || _panelSession.key !== newKey) {
      const stepName = meta.step_name || meta.character || "Storyteller";
      const description = meta.description || p.text || "";
      const wakeupName = meta.target_player_name
        || lookupPlayerName(p.target_player_id);
      _panelSession = {
        key: newKey,
        character: meta.character || null,
        target_pid: p.target_player_id ?? null,
        title: stepName,
        description: description,
        wakeupName: (meta.character && wakeupName) ? wakeupName : null,
        stages: [],
        drunkPoisonState: meta.drunk_poison_state || null,
      };
    }

    // Compute highlight ids first — they apply to BOTH normal prompt
    // mode and show-player mode (the highlights point out which
    // players the message is about).
    const highlightIds = collectHighlightIds(p);
    applyHighlight(highlightIds);

    document.body.classList.add("has-prompt");
    document.body.classList.toggle("show-player", isPayload);
    // The Spy's grimoire prompt rides on the same show-player /
    // showCard plumbing as every other "show this to player" payload,
    // but opts out of the chair-collapsing so the Spy sees every
    // character and token. The CSS guards on ``show-player`` are
    // gated on ``:not(.show-full-grimoire)``; this toggle drives them.
    document.body.classList.toggle(
      "show-full-grimoire",
      isPayload && !!(meta && meta.show_full_grimoire),
    );

    if (isPayload) {
      // Show-player mode. Re-render chairs to strip them down to
      // names-only, hide the prompt card, and populate #showCard with
      // the message the player will read off.
      render();

      const namesById = new Map();
      for (const ch of chairs.values()) {
        const pid = (typeof ch.player_id === "number") ? ch.player_id : ch.id;
        namesById.set(pid, ch.name || ("seat " + ch.id));
      }
      const targetName = (p.target_player_id != null && namesById.has(p.target_player_id))
        ? namesById.get(p.target_player_id)
        : (meta.target_player_name || "the player");
      showTarget.textContent = targetName;

      const description = (_panelSession && _panelSession.description) || "";
      const tokens = buildInfoTokens(p, meta, namesById, description);
      showTokens.innerHTML = "";
      for (const t of tokens) {
        const row = document.createElement("div");
        row.className = "token-row";
        if (t.label) {
          const labelEl = document.createElement("div");
          labelEl.className = "token-label";
          labelEl.textContent = t.label;
          row.appendChild(labelEl);
        }
        if (t.body) {
          const bodyEl = document.createElement("div");
          bodyEl.className = "token-body";
          bodyEl.textContent = t.body;
          row.appendChild(bodyEl);
        }
        showTokens.appendChild(row);
      }
      return;
    }

    // Normal prompt-card path.
    render(); // re-render so chairs leave show-player mode if needed

    // Title.
    if (_panelSession.drunkPoisonState) {
      promptTitle.innerHTML =
        `${escapeHtml(_panelSession.title)} `
        + `<em class="impaired-label">`
        + `(${escapeHtml(_panelSession.drunkPoisonState)})`
        + `</em>`;
    } else {
      promptTitle.textContent = _panelSession.title;
    }

    // Description.
    promptDescription.textContent = _panelSession.description || "";

    // Stages (simple — we don't track history as elaborately as the
    // desktop does on phone, but we surface the active question).
    promptStages.innerHTML = "";
    const stage = document.createElement("div");
    stage.className = "stage active";
    const q = document.createElement("span");
    q.className = "q";
    q.textContent = stageQuestionLabel(p);
    stage.appendChild(q);
    promptStages.appendChild(stage);

    // Options.
    promptOptions.innerHTML = "";
    promptHint.textContent = "";

    if (p.type === "yes_no") {
      const def = meta.default;
      const correct = meta.correct;
      _selectedYesNo = (def === true || def === false) ? def : null;
      [["Yes", true], ["No", false]].forEach(([label, val]) => {
        const opt = document.createElement("button");
        opt.type = "button";
        opt.className = "option";
        opt.textContent = label;
        opt.dataset.yesno = String(val);
        if (def === val) opt.classList.add("default-hint");
        if (correct === val) opt.classList.add("correct-hint");
        opt.addEventListener("click", () => {
          _selectedYesNo = val;
          renderSelectionState();
        });
        promptOptions.appendChild(opt);
      });
      promptHint.textContent = (def === true) ? "Default: Yes"
        : (def === false ? "Default: No" : "");
      renderSelectionState();
    } else if (p.type === "select_player" || p.type === "select_players") {
      const eligible = p.eligible_player_ids || [];
      const count = p.count || 1;
      promptHint.textContent = `Pick ${count} player${count > 1 ? "s" : ""} (tap chair).`;
      const namesById = new Map();
      for (const ch of chairs.values()) {
        const pid = (typeof ch.player_id === "number") ? ch.player_id : ch.id;
        namesById.set(pid, ch.name || ("seat " + ch.id));
      }
      const defPids = meta.default;
      if (Array.isArray(defPids)) _selectedPlayerIds = defPids.slice(0, count);
      else if (typeof defPids === "number") _selectedPlayerIds = [defPids];

      const correctRaw = meta.correct;
      const correctIds = Array.isArray(correctRaw)
        ? correctRaw.map(Number)
        : (typeof correctRaw === "number" ? [correctRaw] : []);
      // Sentinel ``meta.decline_id`` (Po / Professor / Assassin) is
      // mixed into ``eligible_player_ids`` to offer a "decline" choice;
      // render it as a labeled button instead of a phantom Player #0.
      const declineId = (typeof meta.decline_id === "number")
        ? meta.decline_id
        : null;
      const declineLabel = meta.decline_label || "Decline (no target)";
      eligible.forEach(pid => {
        const opt = document.createElement("button");
        opt.type = "button";
        opt.className = "option";
        const isDecline = (declineId !== null && pid === declineId);
        if (isDecline) {
          opt.textContent = declineLabel;
          opt.classList.add("decline-option");
        } else {
          opt.textContent = (namesById.get(pid) || ("Player " + pid)) + " (#" + pid + ")";
        }
        if (_selectedPlayerIds.includes(pid)) opt.classList.add("default-hint");
        if (correctIds.includes(pid)) opt.classList.add("correct-hint");
        opt.dataset.pid = String(pid);
        opt.addEventListener("click", () => {
          if (count === 1) {
            _selectedPlayerIds = [pid];
          } else {
            const idx = _selectedPlayerIds.indexOf(pid);
            if (idx >= 0) _selectedPlayerIds.splice(idx, 1);
            else if (_selectedPlayerIds.length < count) _selectedPlayerIds.push(pid);
          }
          renderSelectionState();
        });
        promptOptions.appendChild(opt);
      });
      renderSelectionState();
    } else if (p.type === "select_character") {
      const eligible = p.eligible_characters || [];
      const count = p.count || 1;
      const def = meta.default;
      const correct = meta.correct;
      const isMulti = count > 1;
      const defSet = new Set(
        Array.isArray(def) ? def : (typeof def === "string" && def ? [def] : [])
      );
      const correctSet = new Set(
        Array.isArray(correct) ? correct
          : (typeof correct === "string" && correct ? [correct] : [])
      );
      if (isMulti) {
        promptHint.textContent = `Pick ${count} characters`
          + (defSet.size ? ` (default: ${Array.from(defSet).join(", ")})` : "");
        _selectedCharacters = Array.from(defSet).slice(0, count);
        _selectedCharacter = null;
      } else {
        promptHint.textContent = "Pick a character" + (def ? ` (default: ${def})` : "");
        if (def) _selectedCharacter = def;
      }
      eligible.forEach(name => {
        const opt = document.createElement("button");
        opt.type = "button";
        opt.className = "option";
        opt.textContent = name;
        opt.dataset.name = name;
        if (defSet.has(name)) opt.classList.add("default-hint");
        if (correctSet.has(name)) opt.classList.add("correct-hint");
        opt.addEventListener("click", () => {
          if (isMulti) {
            const idx = _selectedCharacters.indexOf(name);
            if (idx >= 0) _selectedCharacters.splice(idx, 1);
            else if (_selectedCharacters.length < count) _selectedCharacters.push(name);
            else { _selectedCharacters.shift(); _selectedCharacters.push(name); }
          } else {
            _selectedCharacter = name;
          }
          renderSelectionState();
        });
        promptOptions.appendChild(opt);
      });
      renderSelectionState();
    }
  }

  function stageQuestionLabel(p) {
    if (!p) return "";
    if (p.type === "yes_no") return p.text || "Yes / No?";
    if (p.type === "select_player" || p.type === "select_players") {
      const count = p.count || 1;
      return `${p.text || "Pick"} (${count})`;
    }
    if (p.type === "select_character") {
      const count = p.count || 1;
      return `${p.text || "Pick character"} (${count})`;
    }
    if (p.type === "information") return p.text || "Information.";
    return p.text || "";
  }

  function renderSelectionState() {
    // Reflect picks in the option buttons.
    promptOptions.querySelectorAll(".option").forEach(opt => {
      opt.classList.remove("picked");
      if (opt.dataset.yesno !== undefined) {
        const val = opt.dataset.yesno === "true";
        if (_selectedYesNo === val) opt.classList.add("picked");
      } else if (opt.dataset.pid !== undefined) {
        const pid = parseInt(opt.dataset.pid, 10);
        if (_selectedPlayerIds.includes(pid)) opt.classList.add("picked");
      } else if (opt.dataset.name !== undefined) {
        const name = opt.dataset.name;
        if (_selectedCharacter === name
            || _selectedCharacters.includes(name)) {
          opt.classList.add("picked");
        }
      }
    });
    reapplyChairSelection();
  }

  // Generic info-token renderer driven by ``meta.render`` from the
  // engine. Mirrors the desktop UI; both sides consume the same
  // engine-supplied directive so the UI has zero per-character
  // knowledge.
  function buildInfoTokens(p, meta, namesById, description) {
    const namesFor = (ids) => (ids || [])
      .map(id => namesById.get(id) || ("Player " + id));

    const render = meta && meta.render;
    if (render && Array.isArray(render.tokens) && render.tokens.length) {
      return render.tokens.map(t => ({
        label: t && t.label != null ? String(t.label) : "",
        body:  t && t.body  != null ? String(t.body)  : "",
      }));
    }

    // Fallback (defensive — every real info prompt now ships
    // meta.render).
    const chars = p.highlight_characters || [];
    const playerNames = namesFor(p.highlight_player_ids).join(", ");
    if (chars.length > 0) {
      const charLabel = chars.map(c => String(c).toUpperCase()).join(" / ");
      return [{label: charLabel, body: playerNames || ""}];
    }
    let bodyText = p.text || "";
    if (bodyText === description) bodyText = "";
    return [{
      label: ((meta && meta.character) || "INFO").toUpperCase(),
      body: bodyText,
    }];
  }

  // -----------------------------------------------------------------
  // Send the storyteller's response back to the engine.
  // -----------------------------------------------------------------
  async function respondPrompt(value) {
    const p = _currentPrompt;
    if (!p) return;
    promptHint.textContent = "Sending…";
    try {
      await fetch("/api/engine/respond", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt_id: p.id, response: value }),
      });
    } catch (e) { /* ignore */ }
    _currentPrompt = null;
    _selectedYesNo = null;
    _selectedPlayerIds = [];
    _selectedCharacter = null;
    _selectedCharacters = [];
    promptOptions.innerHTML = "";
    promptHint.textContent = "";
    document.body.classList.remove(
      "has-prompt", "show-player", "show-full-grimoire",
    );
    applyHighlight([]);
    reapplyChairSelection();
    refresh();
    setTimeout(pollPrompt, 80);
  }

  btnNext.addEventListener("click", () => {
    const p = _currentPrompt;
    if (!p) return;
    if (p.type === "yes_no") {
      if (_selectedYesNo !== true && _selectedYesNo !== false) {
        promptHint.textContent = "Pick Yes or No first.";
        return;
      }
      respondPrompt(_selectedYesNo);
    } else if (p.type === "select_player" || p.type === "select_players") {
      const count = p.count || 1;
      if (_selectedPlayerIds.length === 0) {
        promptHint.textContent = "Pick at least one player first.";
        return;
      }
      const value = (count === 1) ? _selectedPlayerIds[0] : _selectedPlayerIds;
      respondPrompt(value);
    } else if (p.type === "select_character") {
      const count = p.count || 1;
      if (count > 1) {
        if (_selectedCharacters.length < count) {
          promptHint.textContent =
            `Pick ${count} characters first (currently ${_selectedCharacters.length}).`;
          return;
        }
        respondPrompt(_selectedCharacters.slice());
      } else {
        if (!_selectedCharacter) {
          promptHint.textContent = "Pick a character first.";
          return;
        }
        respondPrompt(_selectedCharacter);
      }
    } else {
      respondPrompt(null);
    }
  });

  btnBack.addEventListener("click", async () => {
    btnBack.disabled = true;
    try {
      await fetch("/api/engine/back", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
    } catch (e) { /* ignore */ }
    setTimeout(() => { btnBack.disabled = false; }, 250);
    await refresh();
    pollPrompt();
  });

  // The "show-player" Done button — same as Next on a normal info
  // prompt.
  showNext.addEventListener("click", () => respondPrompt(null));

  // -----------------------------------------------------------------
  // Phase FAB (Start Game / Start Night).
  // -----------------------------------------------------------------
  const phaseFab = document.getElementById("phaseFab");
  function syncPhaseFab() {
    phaseFab.classList.remove("start-game", "start-night");
    if (engineState.phase === "setup") {
      phaseFab.classList.add("start-game");
      phaseFab.textContent = "▶ Start Game";
    } else if (engineState.phase === "day") {
      phaseFab.classList.add("start-night");
      phaseFab.textContent = "🌙 Start Night";
    }
  }
  phaseFab.addEventListener("click", async () => {
    if (engineState.phase === "setup") {
      await postEngine("start_game", {});
    } else if (engineState.phase === "day") {
      // Day → Night requires two steps: advance_to_night flips the
      // engine into NIGHT (running dusk + win checks), then
      // start_night spins up the night-thread worker that walks the
      // night sheet. Calling start_night by itself fails with
      // "start_night called in phase day" — that's the bug that
      // made the button look broken.
      const ok = await postEngine("advance_to_night", {});
      if (ok) {
        await postEngine("start_night", {});
      }
    } else if (engineState.phase === "first_night"
            || engineState.phase === "night") {
      // Engine is already in night — the worker just isn't running
      // yet (or got interrupted). Restart it. The server treats an
      // already-running thread as an error; postEngine will surface
      // it inline, which is the intended UX.
      await postEngine("start_night", {});
    }
    pollPrompt();
  });

  // -----------------------------------------------------------------
  // Helpers.
  // -----------------------------------------------------------------
  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  document.addEventListener("contextmenu", (ev) => ev.preventDefault());

  // After every refresh, sync the phase FAB.
  const _origReflectPhase = reflectPhaseClass;
  reflectPhaseClass = function () {
    _origReflectPhase();
    syncPhaseFab();
  };

  // -----------------------------------------------------------------
  // Player-join QR modal. Opens from the topbar button. Pulls the LAN
  // base URL from /api/host_info, builds the same /player URL the
  // desktop QR builds, and renders it via qrcodegen (already loaded
  // for completeness via /static/qrcodegen.js).
  // -----------------------------------------------------------------
  const qrPlayerBackdrop = document.getElementById("qrPlayerBackdrop");
  const qrPlayerFrame = document.getElementById("qrPlayerFrame");
  const qrPlayerUrl = document.getElementById("qrPlayerUrl");
  const btnPlayerQr = document.getElementById("btnPlayerQr");
  const btnPlayerQrClose = document.getElementById("btnPlayerQrClose");

  async function _detectPlayerQrUrl() {
    try {
      const r = await fetch("/api/host_info", { cache: "no-store" });
      if (r.ok) {
        const info = await r.json();
        if (info && info.lan_ip) {
          const port = info.port || window.location.port;
          const portPart = port ? ":" + port : "";
          return "http://" + info.lan_ip + portPart + "/player";
        }
      }
    } catch (e) {
      // fall through to origin-based URL
    }
    return window.location.origin + "/player";
  }

  function _qrToSvgString(qr, border) {
    const n = qr.size + border * 2;
    let d = "";
    for (let y = 0; y < qr.size; y++) {
      for (let x = 0; x < qr.size; x++) {
        if (qr.getModule(x, y)) d += `M${x + border},${y + border}h1v1h-1z`;
      }
    }
    return (
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" ` +
      `shape-rendering="crispEdges">` +
      `<rect width="100%" height="100%" fill="#ffffff"/>` +
      `<path d="${d}" fill="#000000"/></svg>`
    );
  }

  async function openPlayerQrModal() {
    qrPlayerFrame.innerHTML = "<span style='color:#888;font-size:13px'>Loading…</span>";
    qrPlayerUrl.textContent = "";
    qrPlayerBackdrop.classList.add("open");
    let url;
    try {
      url = await _detectPlayerQrUrl();
    } catch (e) {
      url = window.location.origin + "/player";
    }
    qrPlayerUrl.textContent = url;
    try {
      const QRC = qrcodegen.QrCode;
      const qr = QRC.encodeText(url, QRC.Ecc.QUARTILE);
      qrPlayerFrame.innerHTML = _qrToSvgString(qr, 4);
    } catch (e) {
      qrPlayerFrame.innerHTML =
        "<span style='color:#a55;font-size:12px'>Couldn't render QR.</span>";
    }
  }

  function closePlayerQrModal() {
    qrPlayerBackdrop.classList.remove("open");
  }

  btnPlayerQr.addEventListener("click", openPlayerQrModal);
  btnPlayerQrClose.addEventListener("click", closePlayerQrModal);
  qrPlayerBackdrop.addEventListener("click", (ev) => {
    if (ev.target === qrPlayerBackdrop) closePlayerQrModal();
  });

  // -----------------------------------------------------------------
  // Init: kick off polling loops.
  // -----------------------------------------------------------------
  refresh();
  pollPrompt();
  setInterval(refresh, POLL_STATE_MS);
  setInterval(pollPrompt, POLL_PROMPT_MS);

  // Refresh when phone returns from background.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      refresh();
      pollPrompt();
    }
  });
})();
</script>

</body>
</html>
