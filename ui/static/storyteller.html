<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Storyteller — Town Square</title>
<!-- Storyteller UI (named by its audience: the storyteller, NOT a
     player). This is the portrait-phone mirror of the Local UI
     (index.html), reached when the storyteller scans the
     Storyteller QR shown on the Local UI. It renders the full
     grimoire (player names, characters, status reminder tokens,
     dead shrouds) in setup view-only mode and during the game.
     During the game tapping a chair opens the per-player side panel
     (and is also how the storyteller answers SELECT_PLAYER
     prompts).

     Special "show-player" mode: when a SHOW-THIS-TO-PLAYER prompt is
     active, the grimoire collapses to just the player names (no
     tokens, no states, no alive/dead). The desktop prompt UI is
     hidden and a bottom-of-screen card displays the message the
     player should read. This mode lets the storyteller hand THIS
     phone across the table as a fallback when the player's own
     Player UI is unavailable.

     The Player UI — the read-only per-seat view a player gets when
     they scan their OWN QR — is a *separate* file (player.html),
     and unlike this surface it never displays player character
     information during the game. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1410" />
<style>
  :root {
    --bg: #1a1410;
    --panel: #221c17;
    --panel2: #2b2218;
    --board-edge: #8a6a4b;
    --chair: #d9c9a8;
    --chair-edge: #5a3f27;
    --chair-hover: #f0dfb8;
    --st-fill: #6e1f1b;
    --st-edge: #f0c27a;
    --st-text: #f5e6c4;
    --text: #ece3d3;
    --muted: #a99880aa;
    --accent: #f0c27a;
    --danger: #c7453a;
    --good: #8cc97a;
    --evil: #d77676;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---------------------- top bar ---------------------- */
  header.topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(40px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    background: var(--panel);
    border-bottom: 1px solid #00000088;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 30;
  }
  header.topbar h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    flex: 1;
  }
  header.topbar .phase-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid #ffffff22;
    border-radius: 999px;
  }
  body.phase-night header.topbar .phase-tag {
    background: #1f2c40; color: #c7d4ff;
    border-color: #2d4263;
  }
  body.phase-day header.topbar .phase-tag {
    background: #3b2a1c; color: #f0c27a;
    border-color: #5a3f27;
  }
  body.phase-finished header.topbar .phase-tag {
    background: #3b1f1c; color: #f5b8b3;
    border-color: #5a2e29;
  }

  /* QR button in the top bar — opens a fullscreen modal showing the
     player-join URL as a QR code so the storyteller can hand the
     phone to a player who hasn't scanned the desktop's QR yet. */
  header.topbar .qr-btn {
    background: #2a2118;
    color: var(--text);
    border: 1px solid #00000099;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  header.topbar .qr-btn:hover { border-color: #f0c27a; }

  /* QR modal — opens fullscreen, contains a single rendered QR plus
     the resolved URL. Tap the backdrop or the close button to dismiss. */
  #qrPlayerBackdrop {
    position: fixed;
    inset: 0;
    background: #000000d8;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  #qrPlayerBackdrop.open { display: flex; }
  #qrPlayerCard {
    background: var(--panel);
    border: 1px solid #00000099;
    border-radius: 8px;
    padding: 18px;
    width: min(92vw, 380px);
    text-align: center;
    color: var(--text);
  }
  #qrPlayerCard h2 {
    margin: 0 0 4px;
    font-size: 15px;
    color: #f0c27a;
    letter-spacing: 0.02em;
  }
  #qrPlayerCard .sub {
    margin: 0 0 12px;
    font-size: 12px;
    color: var(--muted);
  }
  #qrPlayerCard .qr-frame {
    background: #fff;
    border-radius: 6px;
    padding: 12px;
    margin: 0 auto 10px;
    width: min(86vw, 280px);
    height: min(86vw, 280px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #qrPlayerCard .qr-frame svg {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  #qrPlayerCard .url {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: #aaa;
    word-break: break-all;
  }
  #qrPlayerCard .actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  #qrPlayerCard button {
    background: #2a2118;
    color: var(--text);
    border: 1px solid #00000099;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #qrPlayerCard button:hover { border-color: #f0c27a; }

  /* ---------------------- main board ------------------- */
  main {
    position: absolute;
    top: calc(40px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    bottom: 0;
    padding: 6px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
  }

  #boardWrap {
    position: relative;
    aspect-ratio: 1 / 1;
    width: min(100%, 96vw);
    margin: 4px auto 0;
    flex: 0 0 auto;
  }

  #board {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #4a3525 0%, #2a1c13 100%);
    border: 2px solid var(--board-edge);
    border-radius: 6px;
    box-shadow: 0 4px 24px #00000088, inset 0 0 60px #00000077;
    touch-action: none; /* JS handles pinch-zoom + pan on the board */
  }

  /* Floating "Reset zoom" affordance — only visible when the board
     viewBox has been pinched in. Toggled via the .visible class from
     the pinch-zoom code in the main IIFE. */
  .zoom-reset {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0, 0, 0, 0.65);
    color: #ece3d3;
    border: 1px solid var(--board-edge);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    z-index: 5;
    display: none;
  }
  .zoom-reset.visible { display: block; }

  /* Chair circles + text */
  .chair {
    cursor: pointer;
    transition: fill 0.12s, stroke 0.12s;
  }
  body.show-player .chair { cursor: default; }

  .chair-name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 22px;
    font-weight: 700;
    fill: #2a1c13;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
  }
  .chair-character {
    font-size: 19px;
    font-weight: 500;
    font-style: italic;
    fill: #5a3f27;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
  }
  .chair-num {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 16px;
    font-weight: 700;
    fill: #2a1c13;
    pointer-events: none;
    user-select: none;
    text-anchor: middle;
  }

  /* Status tokens (all <image> + halo) */
  .chair-status-token { pointer-events: none; }
  .chair-status-halo  { pointer-events: none; }

  /* Storyteller marker */
  .storyteller-rect {
    fill: var(--st-fill);
    stroke: var(--st-edge);
    stroke-width: 3;
  }
  .storyteller-label {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    fill: var(--st-text);
    dominant-baseline: central;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
  }

  /* Highlighting for prompts */
  #chairs.highlight-active g[data-id] {
    opacity: 0.25;
    transition: opacity 0.18s;
  }
  #chairs.highlight-active g[data-id].highlight-target {
    opacity: 1;
    filter: drop-shadow(0 0 12px #f0c27aaa);
  }
  /* Selection ring (storyteller picks) */
  g[data-id].chair-picked .chair {
    stroke: #6fd4d2;
    stroke-width: 5;
    filter: drop-shadow(0 0 14px #6fd4d2cc);
  }

  /* Dead shroud */
  .chair-shroud { pointer-events: none; user-select: none; }
  .chair-shroud .shroud-cloth {
    fill: #0c0a08;
    fill-opacity: 0.78;
    stroke: #000;
    stroke-width: 1.5;
    stroke-opacity: 0.9;
  }
  .chair-shroud .shroud-fold {
    fill: none;
    stroke: #2a1f17;
    stroke-width: 1.2;
    stroke-opacity: 0.55;
  }
  .chair-shroud .shroud-mark {
    fill: var(--danger);
    fill-opacity: 0.92;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 36px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
  }
  g[data-id].chair-dead .chair-name,
  g[data-id].chair-dead .chair-character,
  g[data-id].chair-dead .chair-num {
    opacity: 0.45;
  }
  g[data-id].chair-dead .chair-status-token { opacity: 0.75; }

  /* In show-player mode the chairs strip down to just the name —
     no character text, no shroud, no tokens, no highlights for
     non-target chairs. The grimoire is being shown to a player; we
     don't want to leak any state. The ``:not(.show-full-grimoire)``
     guard exempts the Spy's "study the grimoire" prompt: in that
     case the player is *meant* to see every character and token, so
     the chairs render normally even though show-player is set (we
     still want the showCard at the bottom and the promptCard
     suppressed). */
  body.show-player:not(.show-full-grimoire) g[data-id].chair-dead .chair-name { opacity: 1; }
  body.show-player:not(.show-full-grimoire) .chair-shroud,
  body.show-player:not(.show-full-grimoire) .chair-character,
  body.show-player:not(.show-full-grimoire) .chair-num,
  body.show-player:not(.show-full-grimoire) .chair-status-token,
  body.show-player:not(.show-full-grimoire) .chair-status-halo {
    display: none;
  }

  /* ----------------- bottom prompt panel ---------------- */
  /* Fixed slide-up card at the bottom — the equivalent of the
     desktop's #phaseDock + #promptPanel. Visible whenever the
     engine has produced a prompt; in show-player mode this is
     replaced by #showCard below. */
  #promptCard {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    background: var(--panel);
    border: 1px solid #ffffff1c;
    border-radius: 14px;
    box-shadow: 0 -8px 32px #000000aa;
    z-index: 20;
    padding: 10px 12px 12px;
    max-height: 55vh;
    overflow-y: auto;
    display: none;
  }
  body.has-prompt:not(.show-player) #promptCard { display: block; }

  #promptCard .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  #promptCard .impaired-label {
    color: #d77676;
    font-style: italic;
    font-weight: 500;
    font-size: 12px;
  }
  #promptCard .description {
    font-size: 12.5px;
    color: var(--text);
    opacity: 0.85;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  #promptCard .stage {
    font-size: 12.5px;
    color: var(--text);
    margin: 4px 0;
  }
  #promptCard .stage .q { color: #c8b994; }
  #promptCard .stage .a {
    color: #1a1410;
    background: var(--accent);
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 6px;
    font-weight: 600;
    font-size: 11.5px;
    display: inline-block;
  }
  #promptCard .stage.active .q { color: #f5e6c4; font-weight: 600; }

  #promptCard .options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 6px;
  }
  #promptCard .option {
    background: #2f2418;
    color: var(--text);
    border: 1px solid #ffffff20;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #promptCard .option.default-hint {
    border-color: var(--accent);
    background: #3b2a1c;
  }
  #promptCard .option.correct-hint {
    box-shadow: 0 0 0 2px #5db05688;
  }
  #promptCard .option.picked {
    background: var(--accent);
    color: #1a1410;
    border-color: var(--accent);
    font-weight: 600;
  }

  #promptCard .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  #promptCard .actions .left {
    font-size: 11.5px;
    color: var(--muted);
    flex: 1;
  }
  #promptCard button.action {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #promptCard button.action.next {
    background: var(--accent);
    color: #1a1410;
  }
  #promptCard button.action.back {
    background: #3a2a22;
    color: #d8b8a8;
  }
  #promptCard button.action.danger {
    background: var(--danger);
    color: #fff;
  }
  #promptCard button.action.start {
    background: var(--good);
    color: #143215;
  }
  #promptCard button.action[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* SHOW THIS TO PLAYER card. Replaces #promptCard while
     ``body.show-player`` is set. The grimoire above it has already
     collapsed to player-name-only mode with the highlight set still
     active — this card shows the actual message the player will
     read off the phone. */
  #showCard {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, #2b2218 0%, #1f1813 100%);
    border: 1px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 -8px 32px #000000aa, 0 0 0 1px #f0c27a33;
    z-index: 20;
    padding: 12px 14px;
    max-height: 50vh;
    overflow-y: auto;
    display: none;
  }
  body.show-player #showCard { display: block; }
  #showCard .show-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  #showCard .show-target {
    font-size: 17px;
    font-weight: 700;
    color: #f5e6c4;
    margin-bottom: 8px;
  }
  #showCard .token-row {
    background: #1a1410;
    border: 1px solid #f0c27a44;
    border-radius: 10px;
    padding: 8px 10px;
    margin: 6px 0;
  }
  #showCard .token-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 600;
  }
  #showCard .token-body {
    font-size: 15px;
    margin-top: 4px;
    color: var(--text);
    line-height: 1.35;
  }
  #showCard .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }
  #showCard button {
    background: var(--accent);
    color: #1a1410;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ----------------- side panel ------------------------ */
  /* Slim mobile side panel; slides in from the right when the
     storyteller taps a chair during the game. View-only during
     setup, never opens in show-player mode. */
  #seatPanel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(85vw, 320px);
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border-left: 1px solid #00000088;
    box-shadow: -10px 0 32px #00000099;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 40;
    overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 14px) 14px max(14px, env(safe-area-inset-bottom));
  }
  #seatPanel.open { transform: translateX(0); }

  #seatPanel .close-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 6px);
    right: 8px;
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 22px;
    line-height: 1;
    padding: 6px 10px;
    cursor: pointer;
  }
  #seatPanel .close-btn:hover { color: #fff; }

  #seatPanel .player-name {
    font-size: 19px;
    font-weight: 700;
    color: #f5e6c4;
    margin: 4px 0 2px;
    padding-right: 30px;
  }
  #seatPanel .player-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  #seatPanel .section-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-top: 14px;
    margin-bottom: 4px;
  }
  #seatPanel .row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ffffff14;
    padding: 5px 0;
    font-size: 13px;
  }
  #seatPanel .row .label { color: #c8b994; }
  #seatPanel .row .value { color: var(--text); font-weight: 600; }
  #seatPanel .row .value.dead { color: var(--evil); }
  #seatPanel .row .value.alive { color: var(--good); }
  #seatPanel .row .value.evil { color: var(--evil); }
  #seatPanel .row .value.good { color: var(--good); }
  #seatPanel .row .value.flag-on { color: var(--accent); }
  #seatPanel .row .value.flag-off { color: #6a5e44; }

  #seatPanel .actions {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  #seatPanel .actions button {
    background: #3a2a22;
    color: var(--text);
    border: 1px solid #ffffff22;
    border-radius: 8px;
    padding: 9px 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #seatPanel .actions button.danger {
    background: var(--danger);
    color: #fff;
    border-color: #c7453a;
  }
  #seatPanel .actions button[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #seatPanel .seat-msg {
    margin-top: 10px;
    font-size: 12px;
    color: var(--evil);
  }
  #seatPanel .seat-msg.ok { color: var(--good); }

  /* ----------------- floating bottom-right phase button ------ */
  #phaseFab {
    position: fixed;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 19;
    background: #3a2a22;
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  body.phase-day:not(.has-prompt):not(.show-player) #phaseFab.start-night,
  body.phase-setup:not(.has-prompt):not(.show-player) #phaseFab.start-game {
    display: block;
  }
  #phaseFab.start-night { background: #1f2c40; color: #c7d4ff; border-color: #4d6ba0; }
  #phaseFab.start-game  { background: var(--good); color: #143215; border-color: #5db056; }

  /* Show-player banner (top-of-board reminder) */
  #showBanner {
    position: fixed;
    top: calc(40px + env(safe-area-inset-top) + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #1a1410;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    z-index: 25;
    pointer-events: none;
    display: none;
  }
  body.show-player #showBanner { display: block; }

  /* Game-end banner */
  #gameEndBanner {
    position: fixed;
    top: calc(40px + env(safe-area-inset-top) + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: #3a1a1a;
    color: #f5b8b3;
    border: 1px solid var(--danger);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 11.5px;
    font-weight: 600;
    z-index: 25;
    pointer-events: none;
    display: none;
  }
  body.phase-finished:not(.show-player) #gameEndBanner { display: block; }
</style>
</head>
<body class="phase-setup">

<header class="topbar">
  <h1>Storyteller — Town Square</h1>
  <span class="phase-tag" id="phaseTag">setup</span>
  <button type="button" class="qr-btn" id="btnPlayerQr"
          title="Show the player join QR">📱 Player QR Code</button>
</header>

<!-- Player-join QR modal. Opened from the topbar so the storyteller
     can hand their phone to a player who hasn't scanned the desktop
     QR yet. The QR points at /player on the LAN base URL detected
     via /api/host_info. -->
<div id="qrPlayerBackdrop" role="dialog" aria-modal="true">
  <div id="qrPlayerCard">
    <h2>Players: scan to join</h2>
    <p class="sub">They'll be added to the lobby on the storyteller's screen.</p>
    <div class="qr-frame" id="qrPlayerFrame"></div>
    <div class="url" id="qrPlayerUrl"></div>
    <div class="actions">

</div>

<main>

<!-- Per-player side panel. Mirrors index.html's seatPanel with a

  <div class="show-header">Show this to</div>
  <div class="show-target" id="showTarget">—</div>
